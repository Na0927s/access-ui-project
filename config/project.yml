constraints:
  store_login_info: false          # 로그인 정보·분석 결과를 DB/서버/localStorage에 저장하지 않음
  store_uploaded_images: false     # 업로드 이미지는 분석 후 즉시 폐기
  backend_user_management: false   # 백엔드에 회원 관리 기능 없음
