# Project Configuration
# Generated by 01-template (수정: Python FastAPI / SPA / SQLite(WAL) + SQLAlchemy 2.0 + bcrypt / AI 문서 생성)

project:
  name: "ColorLens"
  code: "AU"
  slug: "access-ui"
  type: "web"
  subtype: "spa"
  created: "2026-09-22"

tier: "standard"

tech_stack:
  backend:
    language: "Python"
    version: "3.12"
    framework: "fastapi"
    orm: "sqlalchemy"            # SQLAlchemy 2.0
    image_processing: "Pillow"
    auth: "bcrypt"               # 비밀번호 해시 (rounds=12), in-memory opaque token 세션

  frontend:
    framework: "react"
    language: "TypeScript"
    build_tool: "vite"
    ui_library: "TailwindCSS"
    state_management: "Zustand"   # persist 미들웨어 사용 금지

  databases:
    - type: "sqlite"             # SQLite (WAL 모드)
      orm: "sqlalchemy"

  infrastructure:                  # 선택하지 않음
    cloud: []
    serverless: []
    baas: []
    container: []
    cicd: []

options:
  gsd_workflow: true
  code_scaffolding: true
  korean_localization: true
  ai_docs:
    enabled: true
    provider: "claude"
    api_key: "server"

constraints:
  store_login_info: true           # 로그인 사용자 계정·분석 결과는 SQLite DB에 영속화 (비로그인은 메모리만)
  persist_auth_token: false        # 인증 토큰·세션은 서버 메모리에만 (localStorage/sessionStorage/쿠키/JWT 금지)
  store_uploaded_images: false     # 업로드 이미지 바이트는 DB·디스크 저장 금지 (SHA-256 해시만 캐시 키)
  backend_user_management: true    # 백엔드에 회원가입·로그인·사용자 API 구현 (bcrypt 해시)
  user_id_in_url: false            # user_id를 URL 경로로 받지 않음 (Authorization: Bearer에서 추출)
